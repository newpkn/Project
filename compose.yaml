services:
  app:
    build: .
    container_name: my_app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=admin439266
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: mysql:8.0
    container_name: my_db
    environment:
      - MYSQL_ROOT_PASSWORD=admin439266
      - MYSQL_DATABASE=my_database
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: